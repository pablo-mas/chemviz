<html lang="en">

<style>
:root {
  --bg: #ffffff; --panel: #f7f7f8; --border: #dcdce0; --text: #1d1d22; --muted: #6b6b75;
  --accent: #2f6fde; --hover: #e9e9ee; --tooltip: #ffffff; --shadow: 0 4px 18px rgba(0,0,0,.14);
  --edge: #8a8a96; --na: #c4c4cc; --select: #111111;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15151a; --panel: #1e1e25; --border: #33333d; --text: #e7e7ec; --muted: #9a9aa6;
    --accent: #6c9cff; --hover: #2a2a33; --tooltip: #22222a; --shadow: 0 4px 18px rgba(0,0,0,.5);
    --edge: #6a6a78; --na: #55555f; --select: #ffffff;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
#app { position: fixed; inset: 0; display: flex; }
#panel { width: 290px; flex: none; background: var(--panel); border-right: 1px solid var(--border);
  overflow-y: auto; padding: 12px 14px 24px; transition: margin-left .15s; }
#panel.hidden { margin-left: -290px; }
#stage { position: relative; flex: 1; min-width: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#overlay { pointer-events: none; }
h1 { font-size: 15px; margin: 0 0 2px; overflow-wrap: anywhere; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
  margin: 18px 0 6px; font-weight: 600; }
.muted { color: var(--muted); }
select, input[type=text], input[type=number], button {
  font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 7px; }
select, input[type=text] { width: 100%; }
button { cursor: pointer; }
button:hover { background: var(--hover); }
.row { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
.row > * { min-width: 0; }
.grow { flex: 1; }
label.slider { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
label.slider span { width: 82px; flex: none; }
label.slider input { flex: 1; }
#legend { margin-top: 8px; max-height: 260px; overflow-y: auto; }
.legend-item { display: flex; align-items: center; gap: 7px; padding: 2px 4px; border-radius: 4px;
  cursor: pointer; user-select: none; }
.legend-item:hover { background: var(--hover); }
.legend-item.off { opacity: .35; }
.swatch { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.legend-item .count { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
.legend-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#colorbar { height: 10px; border-radius: 3px; margin-top: 8px; }
.ticks { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
.filter { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
.filter .title { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.filter .title button { border: none; background: none; padding: 0 4px; color: var(--muted); }
.filter .cats { max-height: 150px; overflow-y: auto; margin-top: 4px; }
.filter .cats label { display: flex; gap: 6px; align-items: center; }
.filter input[type=number] { width: 100%; }
#tooltip { position: absolute; pointer-events: none; background: var(--tooltip); border: 1px solid var(--border);
  border-radius: 8px; box-shadow: var(--shadow); padding: 8px 10px; max-width: 320px; display: none; z-index: 5; }
#tooltip svg { display: block; margin: 0 auto 4px; }
#tooltip .smiles { font-family: ui-monospace, monospace; font-size: 11px; color: var(--muted);
  overflow-wrap: anywhere; margin-bottom: 4px; }
#tooltip table { border-collapse: collapse; width: 100%; }
#tooltip td { padding: 1px 0; vertical-align: top; }
#tooltip td:first-child { color: var(--muted); padding-right: 10px; white-space: nowrap; }
#tooltip td:last-child { overflow-wrap: anywhere; }
#toggle { position: absolute; top: 10px; left: 10px; z-index: 4; }
#status { position: absolute; bottom: 8px; right: 12px; color: var(--muted); font-size: 11px; pointer-events: none; }
#loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 14px; }
.hint { font-size: 11px; color: var(--muted); margin-top: 6px; }
</style>

__CHEMVIZ_RDKIT__
<script>
"use strict";
const RDKIT_URL = "https://cdn.jsdelivr.net/npm/@rdkit/rdkit@2026.9.1/dist/";
const TAB10 = ["#1f77b4","#ff7f0e","#2ca02c","#d62728","#9467bd","#8c564b","#e377c2","#7f7f7f","#bcbd22","#17becf"];
const TAB20 = ["#1f77b4","#aec7e8","#ff7f0e","#ffbb78","#2ca02c","#98df8a","#d62728","#ff9896","#9467bd","#c5b0d5",
  "#8c564b","#c49c94","#e377c2","#f7b6d2","#7f7f7f","#c7c7c7","#bcbd22","#dbdb8d","#17becf","#9edae5"];
const VIRIDIS = ["#440154","#482878","#3e4989","#31688e","#26828e","#1f9e89","#35b779","#6ece58","#b5de2b","#fde725"];
const MAX_COLORS = 20;

const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const hexToRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const cssColorRgb = (c) => {
  const ctx = document.createElement("canvas").getContext("2d");
  ctx.fillStyle = c; ctx.fillRect(0, 0, 1, 1);
  return Array.from(ctx.getImageData(0, 0, 1, 1).data.slice(0, 3));
};

function viridisLut() {
  const stops = VIRIDIS.map(hexToRgb), lut = new Uint8Array(256 * 3);
  for (let i = 0; i < 256; i++) {
    const t = i / 255 * (stops.length - 1), a = Math.floor(t), b = Math.min(a + 1, stops.length - 1), f = t - a;
    for (let c = 0; c < 3; c++) lut[i * 3 + c] = Math.round(stops[a][c] * (1 - f) + stops[b][c] * f);
  }
  return lut;
}

function formatValue(v, integer) {
  if (typeof v !== "number") return v;
  if (!Number.isFinite(v)) return "–";
  if (integer) return String(Math.round(v));
  const a = Math.abs(v);
  return a !== 0 && (a < 1e-3 || a >= 1e6) ? v.toExponential(3) : String(+v.toPrecision(4));
}

// ---------------------------------------------------------------- data
async function unpack(id) {  // base64 + zlib payload embedded in a <script> tag
  const b64 = $(id).textContent.trim();
  const compressed = await (await fetch("data:application/octet-stream;base64," + b64)).blob();
  return new Response(compressed.stream().pipeThrough(new DecompressionStream("deflate"))).arrayBuffer();
}

async function loadData() {
  const header = JSON.parse($("chemviz-header").textContent);
  const buf = await unpack("chemviz-data");
  const view = (Type, [offset, length]) => new Type(buf, offset, length / Type.BYTES_PER_ELEMENT);
  const columns = header.columns.map((c) => {
    const ref = [c.offset, c.length];
    if (c.kind === "num") return { ...c, values: view(Float32Array, ref) };
    if (c.kind === "cat") return { ...c, codes: view(Uint32Array, ref) };
    const text = new TextDecoder().decode(new Uint8Array(buf, c.offset, c.length));
    return { ...c, values: header.n ? text.split("\n") : [] };
  });
  return {
    header, columns,
    pos: view(Float32Array, header.positions),
    edges: view(Uint32Array, header.edges),
    byName: Object.fromEntries(columns.map((c) => [c.name, c])),
  };
}

const valueOf = (col, i) => col.kind === "num" ? col.values[i] : col.kind === "cat" ? col.categories[col.codes[i]] : col.values[i];

// ---------------------------------------------------------------- WebGL
const POINT_VS = `#version 300 es
in vec2 a_pos; in vec4 a_color; in float a_flags;
uniform vec2 u_scale, u_offset; uniform float u_size, u_highlight;
out vec4 v_color; out float v_ring;
void main() {
  bool visible = mod(a_flags, 2.0) > 0.5;
  if (!visible) { gl_Position = vec4(2.0, 2.0, 2.0, 1.0); gl_PointSize = 0.0; return; }
  gl_Position = vec4(a_pos * u_scale + u_offset, 0.0, 1.0);
  gl_PointSize = u_highlight > 0.5 ? max(u_size * 1.6, u_size + 6.0) : u_size;
  v_color = a_color; v_ring = u_highlight;
}`;
const POINT_FS = `#version 300 es
precision mediump float;
in vec4 v_color; in float v_ring; uniform vec3 u_ringColor;
out vec4 color;
void main() {
  vec2 d = gl_PointCoord * 2.0 - 1.0; float r = dot(d, d);
  if (r > 1.0) discard;
  if (v_ring > 0.5) { color = r > 0.45 ? vec4(u_ringColor, 1.0) : vec4(v_color.rgb, 1.0); return; }
  color = v_color;
}`;
const EDGE_VS = `#version 300 es
in vec2 a_pos; in vec4 a_color; in float a_flags;
uniform vec2 u_scale, u_offset;
out vec4 v_color; out float v_visible;
void main() {
  gl_Position = vec4(a_pos * u_scale + u_offset, 0.0, 1.0);
  v_color = a_color; v_visible = mod(a_flags, 2.0) > 0.5 ? 1.0 : 0.0;
}`;
const EDGE_FS = `#version 300 es
precision mediump float;
in vec4 v_color; in float v_visible; uniform float u_alpha; uniform vec3 u_edgeColor; uniform float u_mix;
out vec4 color;
void main() {
  if (v_visible < 0.999) discard;  // hidden as soon as one endpoint is hidden
  color = vec4(mix(u_edgeColor, v_color.rgb, u_mix), u_alpha);
}`;

function compile(gl, vs, fs) {
  const prog = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, vs], [gl.FRAGMENT_SHADER, fs]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    gl.attachShader(prog, s);
  }
  gl.bindAttribLocation(prog, 0, "a_pos");
  gl.bindAttribLocation(prog, 1, "a_color");
  gl.bindAttribLocation(prog, 2, "a_flags");
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  const uniforms = {};
  for (let i = 0; i < gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS); i++) {
    const name = gl.getActiveUniform(prog, i).name;
    uniforms[name] = gl.getUniformLocation(prog, name);
  }
  return { prog, uniforms };
}

class Renderer {
  constructor(canvas, data) {
    const gl = canvas.getContext("webgl2", { antialias: true, premultipliedAlpha: false });
    if (!gl) throw new Error("WebGL2 is not available in this browser");
    this.gl = gl; this.canvas = canvas; this.n = data.header.n;
    this.points = compile(gl, POINT_VS, POINT_FS);
    this.lines = compile(gl, EDGE_VS, EDGE_FS);
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    const attrib = (loc, data, size, type, normalized) => {
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, size, type, normalized, 0, 0);
      return buf;
    };
    attrib(0, data.pos, 2, gl.FLOAT, false);
    this.colorBuf = attrib(1, new Uint8Array(this.n * 4), 4, gl.UNSIGNED_BYTE, true);
    this.flagBuf = attrib(2, new Uint8Array(this.n), 1, gl.UNSIGNED_BYTE, false);
    this.edgeBuf = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.edgeBuf);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, data.edges, gl.STATIC_DRAW);
    this.nEdgeIdx = data.edges.length;
    this.highlightBuf = gl.createBuffer();
    this.nHighlight = 0;
    gl.bindVertexArray(null);
  }
  setColors(rgba) { const gl = this.gl; gl.bindBuffer(gl.ARRAY_BUFFER, this.colorBuf); gl.bufferData(gl.ARRAY_BUFFER, rgba, gl.STATIC_DRAW); }
  setFlags(flags) { const gl = this.gl; gl.bindBuffer(gl.ARRAY_BUFFER, this.flagBuf); gl.bufferData(gl.ARRAY_BUFFER, flags, gl.STATIC_DRAW); }
  setHighlight(indices) {
    const gl = this.gl;
    gl.bindVertexArray(this.vao);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.highlightBuf);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.DYNAMIC_DRAW);
    this.nHighlight = indices.length;
    gl.bindVertexArray(null);
  }
  draw(view, opts) {
    const gl = this.gl, dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.round(this.canvas.clientWidth * dpr)), h = Math.max(1, Math.round(this.canvas.clientHeight * dpr));
    if (this.canvas.width !== w || this.canvas.height !== h) { this.canvas.width = w; this.canvas.height = h; }
    gl.viewport(0, 0, w, h);
    const bg = opts.bg;
    gl.clearColor(bg[0] / 255, bg[1] / 255, bg[2] / 255, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    const sx = 2 * view.scale / this.canvas.clientWidth, sy = 2 * view.scale / this.canvas.clientHeight;
    const scale = [sx, sy], offset = [-view.cx * sx, -view.cy * sy];
    gl.bindVertexArray(this.vao);
    if (opts.showEdges && opts.edgeAlpha > 0 && this.nEdgeIdx) {
      const { prog, uniforms: u } = this.lines;
      gl.useProgram(prog);
      gl.uniform2fv(u.u_scale, scale); gl.uniform2fv(u.u_offset, offset);
      gl.uniform1f(u.u_alpha, opts.edgeAlpha);
      gl.uniform3fv(u.u_edgeColor, opts.edgeColor.map((c) => c / 255));
      gl.uniform1f(u.u_mix, opts.edgeMix);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.edgeBuf);
      gl.drawElements(gl.LINES, this.nEdgeIdx, gl.UNSIGNED_INT, 0);
    }
    const { prog, uniforms: u } = this.points;
    gl.useProgram(prog);
    gl.uniform2fv(u.u_scale, scale); gl.uniform2fv(u.u_offset, offset);
    gl.uniform1f(u.u_size, opts.pointSize * dpr);
    gl.uniform3fv(u.u_ringColor, opts.ringColor.map((c) => c / 255));
    gl.uniform1f(u.u_highlight, 0);
    gl.drawArrays(gl.POINTS, 0, this.n);
    if (this.nHighlight) {
      gl.uniform1f(u.u_highlight, 1);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, this.highlightBuf);
      gl.drawElements(gl.POINTS, this.nHighlight, gl.UNSIGNED_INT, 0);
    }
    gl.bindVertexArray(null);
  }
}

// ---------------------------------------------------------------- spatial grid for picking
class Grid {
  constructor(pos, n) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < n; i++) {
      const x = pos[2 * i], y = pos[2 * i + 1];
      if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    if (!n) { x0 = y0 = 0; x1 = y1 = 1; }
    const span = Math.max(x1 - x0, y1 - y0, 1e-9);
    this.g = Math.max(1, Math.ceil(Math.sqrt(n / 4)));
    this.x0 = x0; this.y0 = y0; this.cell = span / this.g * (1 + 1e-6);
    this.bounds = [x0, y0, x1, y1];
    const g = this.g, cellOf = new Uint32Array(n), start = new Uint32Array(g * g + 1);
    for (let i = 0; i < n; i++) {
      const c = this.cellIndex(pos[2 * i], pos[2 * i + 1]);
      cellOf[i] = c; start[c + 1]++;
    }
    for (let c = 0; c < g * g; c++) start[c + 1] += start[c];
    const fill = start.slice(0, g * g), items = new Uint32Array(n);
    for (let i = 0; i < n; i++) items[fill[cellOf[i]]++] = i;
    this.start = start; this.items = items; this.pos = pos;
  }
  clampCell(v) { return Math.min(this.g - 1, Math.max(0, Math.floor(v))); }
  cellIndex(x, y) { return this.clampCell((y - this.y0) / this.cell) * this.g + this.clampCell((x - this.x0) / this.cell); }
  nearest(x, y, radius, visible) {
    const { g, cell, pos } = this;
    const cx0 = this.clampCell((x - radius - this.x0) / cell), cx1 = this.clampCell((x + radius - this.x0) / cell);
    const cy0 = this.clampCell((y - radius - this.y0) / cell), cy1 = this.clampCell((y + radius - this.y0) / cell);
    let best = -1, bestD = radius * radius;
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const c = cy * g + cx;
      for (let k = this.start[c]; k < this.start[c + 1]; k++) {
        const i = this.items[k];
        if (!visible[i]) continue;
        const dx = pos[2 * i] - x, dy = pos[2 * i + 1] - y, d = dx * dx + dy * dy;
        if (d <= bestD) { bestD = d; best = i; }
      }
    }
    return best;
  }
}

// ---------------------------------------------------------------- RDKit.js (lazy)
let rdkitPromise = null;
function rdkit() {
  if (!rdkitPromise && $("chemviz-rdkit_minimal-wasm")) {  // embedded for offline use
    rdkitPromise = (async () => {
      const [js, wasm] = await Promise.all([unpack("chemviz-rdkit_minimal-js"), unpack("chemviz-rdkit_minimal-wasm")]);
      const s = document.createElement("script");
      s.textContent = new TextDecoder().decode(js);
      document.head.appendChild(s);
      // Hand over the embedded module instead of letting RDKit.js fetch RDKit_minimal.wasm.
      return window.initRDKitModule({
        instantiateWasm: (imports, receive) => {
          WebAssembly.instantiate(wasm, imports).then((r) => receive(r.instance));
          return {};
        },
      });
    })().catch((e) => { console.warn(e); return null; });
  }
  if (!rdkitPromise) {
    rdkitPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = RDKIT_URL + "RDKit_minimal.js";
      s.onload = () => window.initRDKitModule({ locateFile: () => RDKIT_URL + "RDKit_minimal.wasm" }).then(resolve, reject);
      s.onerror = () => reject(new Error("Could not load RDKit.js"));
      document.head.appendChild(s);
    }).catch((e) => { console.warn(e); return null; });
  }
  return rdkitPromise;
}
const svgCache = new Map();
function structureSvg(RDKit, smiles) {
  if (svgCache.has(smiles)) return svgCache.get(smiles);
  let svg = "";
  const mol = RDKit.get_mol(smiles);
  if (mol) {
    try { svg = mol.get_svg_with_highlights(JSON.stringify({ width: 240, height: 170, clearBackground: false })); }
    finally { mol.delete(); }
  }
  if (svgCache.size > 2000) svgCache.delete(svgCache.keys().next().value);
  svgCache.set(smiles, svg);
  return svg;
}

// ---------------------------------------------------------------- app
async function main() {
  const data = await loadData();
  const { header, columns, pos } = data;
  const n = header.n;
  document.title = header.title;
  $("title").textContent = header.title;
  const summary = header.n_edges
    ? `${n.toLocaleString()} molecules · ${header.n_edges.toLocaleString()} edges`
    : `${n.toLocaleString()} molecules`;
  $("subtitle").textContent = summary;
  if (!header.n_edges) {  // UMAP, t-SNE and PCA maps have no edges
    $("edge-alpha").closest("label").style.display = "none";
    $("show-edges").closest("label").style.display = "none";
  }

  const renderer = new Renderer($("gl"), data);
  const grid = new Grid(pos, n);
  const smilesCol = header.smiles ? data.byName[header.smiles] : null;
  if (smilesCol) rdkit();  // start downloading in the background

  const state = {
    colorBy: null, filters: new Map(), visible: new Uint8Array(n).fill(1),
    selected: new Uint8Array(n), nSelected: 0, hover: -1,
    view: { cx: 0, cy: 0, scale: 1 },
  };
  let theme = {};
  const readTheme = () => {
    theme = { bg: cssColorRgb(css("--bg")), edge: cssColorRgb(css("--edge")), na: cssColorRgb(css("--na")),
      select: cssColorRgb(css("--select")), accent: css("--accent") };
  };
  readTheme();

  // ---- view
  const stage = $("stage");
  let baseScale = 1;  // scale of the initial full view
  function fitTo(x0, y0, x1, y1) {
    const w = stage.clientWidth, h = stage.clientHeight;
    const dx = Math.max(x1 - x0, 1e-9), dy = Math.max(y1 - y0, 1e-9);
    state.view = { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, scale: 0.92 * Math.min(w / dx, h / dy) };
    redraw();
  }
  const resetView = () => fitTo(...grid.bounds);
  const toData = (px, py) => [(px - stage.clientWidth / 2) / state.view.scale + state.view.cx,
    -(py - stage.clientHeight / 2) / state.view.scale + state.view.cy];
  const toScreen = (x, y) => [(x - state.view.cx) * state.view.scale + stage.clientWidth / 2,
    -(y - state.view.cy) * state.view.scale + stage.clientHeight / 2];

  // ---- drawing
  let frame = 0;
  function redraw() {
    if (frame) return;
    frame = requestAnimationFrame(() => {
      frame = 0;
      const colored = state.colorBy !== null;
      renderer.draw(state.view, {
        bg: theme.bg, edgeColor: theme.edge, ringColor: theme.select,
        pointSize: +$("point-size").value, edgeAlpha: +$("edge-alpha").value,
        showEdges: $("show-edges").checked, edgeMix: colored ? 0.55 : 0,
      });
      $("status").textContent = state.view.scale ? `zoom ×${(state.view.scale / baseScale).toFixed(1)}` : "";
    });
  }

  // ---- colours
  const lut = viridisLut();
  function applyColors() {
    const rgba = new Uint8Array(n * 4), col = state.colorBy !== null ? data.byName[state.colorBy] : null;
    const legend = $("legend");
    legend.innerHTML = "";
    if (!col) {
      const c = hexToRgb(css("--accent").startsWith("#") ? css("--accent") : "#2f6fde");
      for (let i = 0; i < n; i++) rgba.set([c[0], c[1], c[2], 255], i * 4);
    } else if (col.kind === "num") {
      const lo = col.lo ?? 0, hi = col.hi ?? 1, span = hi - lo || 1;
      for (let i = 0; i < n; i++) {
        const v = col.values[i];
        if (Number.isFinite(v)) {
          const k = Math.round(Math.min(1, Math.max(0, (v - lo) / span)) * 255) * 3;
          rgba[i * 4] = lut[k]; rgba[i * 4 + 1] = lut[k + 1]; rgba[i * 4 + 2] = lut[k + 2];
        } else rgba.set(theme.na, i * 4);
        rgba[i * 4 + 3] = 255;
      }
      const bar = document.createElement("div");
      bar.id = "colorbar";
      bar.style.background = `linear-gradient(to right, ${VIRIDIS.join(",")})`;
      const ticks = document.createElement("div");
      ticks.className = "ticks";
      ticks.innerHTML = `<span>${formatValue(lo, col.integer)}</span><span>${formatValue((lo + hi) / 2, col.integer)}</span><span>${formatValue(hi, col.integer)}</span>`;
      const note = document.createElement("div");
      note.className = "hint";
      note.textContent = `1st–99th percentile; full range ${formatValue(col.min, col.integer)} – ${formatValue(col.max, col.integer)}`;
      legend.append(bar, ticks, note);
    } else {
      const k = col.categories.length;
      const palette = (k <= 10 ? TAB10 : TAB20).map(hexToRgb);
      const many = k > MAX_COLORS;
      const colorOf = (code) => many && code >= MAX_COLORS - 1 ? theme.na : palette[code % palette.length];
      for (let i = 0; i < n; i++) { rgba.set(colorOf(col.codes[i]), i * 4); rgba[i * 4 + 3] = 255; }
      const filter = state.filters.get(col.name);
      const shown = many ? MAX_COLORS - 1 : k;
      for (let c = 0; c < shown; c++) legend.append(legendItem(col, c, colorOf(c), filter));
      if (many) {
        const rest = col.counts.slice(shown).reduce((a, b) => a + b, 0);
        const item = document.createElement("div");
        item.className = "legend-item";
        item.innerHTML = `<span class="swatch"></span><span class="name"></span><span class="count"></span>`;
        item.querySelector(".swatch").style.background = `rgb(${theme.na})`;
        item.querySelector(".name").textContent = `${k - shown} other categories`;
        item.querySelector(".count").textContent = rest.toLocaleString();
        item.style.cursor = "default";
        legend.append(item);
      }
      const hint = document.createElement("div");
      hint.className = "hint";
      hint.textContent = "Click a category to hide or show it.";
      legend.append(hint);
    }
    renderer.setColors(rgba);
    redraw();
  }
  function legendItem(col, code, rgb, filter) {
    const item = document.createElement("div");
    item.className = "legend-item" + (filter && !filter.allowed.has(code) ? " off" : "");
    item.innerHTML = `<span class="swatch"></span><span class="name"></span><span class="count"></span>`;
    item.querySelector(".swatch").style.background = `rgb(${rgb})`;
    item.querySelector(".name").textContent = col.categories[code] || "(empty)";
    item.title = item.querySelector(".name").textContent;
    item.querySelector(".count").textContent = col.counts[code].toLocaleString();
    item.onclick = () => {
      let f = state.filters.get(col.name);
      if (!f) { f = addFilter(col.name); }
      if (f.allowed.has(code)) f.allowed.delete(code); else f.allowed.add(code);
      if (f.allowed.size === col.categories.length) removeFilter(col.name);
      else { renderFilters(); applyFilters(); }
      applyColors();
    };
    return item;
  }

  // ---- filters
  function addFilter(name) {
    const col = data.byName[name];
    let f;
    if (col.kind === "num") f = { col, min: col.min ?? 0, max: col.max ?? 0 };  // exact bounds, rounded only for display
    else if (col.kind === "cat") f = { col, allowed: new Set(col.categories.map((_, i) => i)) };
    else f = { col, text: "" };
    state.filters.set(name, f);
    return f;
  }
  function removeFilter(name) {
    state.filters.delete(name);
    renderFilters(); applyFilters();
    if (state.colorBy === name) applyColors();
  }
  function renderFilters() {
    const box = $("filters");
    box.innerHTML = "";
    for (const [name, f] of state.filters) {
      const el = document.createElement("div");
      el.className = "filter";
      el.innerHTML = `<div class="title"><span></span><button title="Remove filter">✕</button></div>`;
      el.querySelector(".title span").textContent = name;
      el.querySelector("button").onclick = () => removeFilter(name);
      if (f.col.kind === "num") {
        const row = document.createElement("div");
        row.className = "row";
        for (const key of ["min", "max"]) {
          const input = document.createElement("input");
          input.type = "number"; input.step = "any"; input.title = key;
          // Round outwards so the displayed bounds still include every value.
          const p = 10 ** (3 - Math.floor(Math.log10(Math.abs(f[key]) || 1)));
          input.value = +((key === "min" ? Math.floor : Math.ceil)(f[key] * p) / p).toPrecision(6);
          input.oninput = () => { const v = parseFloat(input.value); if (!Number.isNaN(v)) { f[key] = v; applyFilters(); } };
          row.append(input);
        }
        el.append(row);
      } else if (f.col.kind === "cat") {
        const cats = document.createElement("div");
        cats.className = "cats";
        f.col.categories.forEach((name, code) => {
          const label = document.createElement("label");
          const cb = document.createElement("input");
          cb.type = "checkbox"; cb.checked = f.allowed.has(code);
          cb.onchange = () => {
            if (cb.checked) f.allowed.add(code); else f.allowed.delete(code);
            applyFilters();
            if (state.colorBy === f.col.name) applyColors();
          };
          const span = document.createElement("span");
          span.textContent = `${name || "(empty)"} (${f.col.counts[code].toLocaleString()})`;
          label.append(cb, span);
          cats.append(label);
        });
        const row = document.createElement("div");
        row.className = "row";
        for (const [label, all] of [["All", true], ["None", false]]) {
          const b = document.createElement("button");
          b.textContent = label;
          b.onclick = () => {
            f.allowed = all ? new Set(f.col.categories.map((_, i) => i)) : new Set();
            renderFilters(); applyFilters();
            if (state.colorBy === f.col.name) applyColors();
          };
          row.append(b);
        }
        el.append(cats, row);
      } else {
        const input = document.createElement("input");
        input.type = "text"; input.placeholder = "contains…"; input.value = f.text;
        input.oninput = () => { f.text = input.value; applyFilters(); };
        el.append(input);
      }
      box.append(el);
    }
  }
  function applyFilters() {
    const vis = state.visible;
    vis.fill(1);
    for (const f of state.filters.values()) {
      const col = f.col;
      if (col.kind === "num") {
        const v = col.values;
        for (let i = 0; i < n; i++) if (vis[i] && !(v[i] >= f.min && v[i] <= f.max)) vis[i] = 0;
      } else if (col.kind === "cat") {
        const allowed = new Uint8Array(col.categories.length);
        for (const c of f.allowed) allowed[c] = 1;
        for (let i = 0; i < n; i++) if (vis[i] && !allowed[col.codes[i]]) vis[i] = 0;
      } else if (f.text) {
        const q = f.text.toLowerCase(), v = col.values;
        for (let i = 0; i < n; i++) if (vis[i] && !v[i].toLowerCase().includes(q)) vis[i] = 0;
      }
    }
    let shown = 0;
    for (let i = 0; i < n; i++) shown += vis[i];
    $("subtitle").textContent = shown === n
      ? summary
      : `${shown.toLocaleString()} of ${n.toLocaleString()} molecules shown`;
    renderer.setFlags(vis);
    updateHighlight();
  }

  // ---- selection
  function updateHighlight() {
    const idx = [];
    for (let i = 0; i < n; i++) if (state.selected[i] && state.visible[i]) idx.push(i);
    if (state.hover >= 0 && !state.selected[state.hover]) idx.push(state.hover);
    renderer.setHighlight(new Uint32Array(idx));
    $("sel-count").textContent = state.nSelected
      ? `${state.nSelected.toLocaleString()} molecule${state.nSelected > 1 ? "s" : ""} selected`
      : "No molecule selected";
    redraw();
  }
  function setSelected(indices, mode) {  // mode: "replace" | "add" | "toggle"
    if (mode === "replace") state.selected.fill(0);
    for (const i of indices) state.selected[i] = mode === "toggle" ? 1 - state.selected[i] : 1;
    state.nSelected = state.selected.reduce((a, b) => a + b, 0);
    updateHighlight();
  }
  function selectionBounds() {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < n; i++) if (state.selected[i]) {
      x0 = Math.min(x0, pos[2 * i]); x1 = Math.max(x1, pos[2 * i]);
      y0 = Math.min(y0, pos[2 * i + 1]); y1 = Math.max(y1, pos[2 * i + 1]);
    }
    return x0 <= x1 ? [x0, y0, x1, y1] : null;
  }
  function zoomToSelection() {
    const b = selectionBounds();
    if (!b) return;
    const pad = Math.max(b[2] - b[0], b[3] - b[1], 20 / baseScale) * 0.15;
    fitTo(b[0] - pad, b[1] - pad, b[2] + pad, b[3] + pad);
  }
  function exportCsv() {
    const rows = [];
    const quote = (v) => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    rows.push([...columns.map((c) => c.name), "x", "y"].map(quote).join(","));
    for (let i = 0; i < n; i++) if (state.selected[i]) {
      rows.push([...columns.map((c) => {
        const v = valueOf(c, i);
        return c.kind === "num" ? (Number.isFinite(v) ? v : "") : v;
      }), pos[2 * i], pos[2 * i + 1]].map(quote).join(","));
    }
    const url = URL.createObjectURL(new Blob([rows.join("\n") + "\n"], { type: "text/csv" }));
    const a = document.createElement("a");
    a.href = url; a.download = `${header.title.replace(/[^\w.-]+/g, "_") || "selection"}_selection.csv`;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // ---- search
  function search() {
    const q = $("search").value.trim().toLowerCase();
    const col = data.byName[$("search-col").value];
    if (!q || !col) { $("search-result").textContent = ""; return; }
    const hits = [];
    for (let i = 0; i < n; i++) {
      const v = col.kind === "cat" ? col.categories[col.codes[i]] : col.values[i];
      if (state.visible[i] && String(v).toLowerCase().includes(q)) hits.push(i);
    }
    $("search-result").textContent = hits.length ? `${hits.length.toLocaleString()} match${hits.length > 1 ? "es" : ""} selected` : "No match";
    setSelected(hits, "replace");
    if (hits.length) zoomToSelection();
  }

  // ---- tooltip
  const tooltip = $("tooltip");
  let tooltipToken = 0;
  async function showTooltip(i, px, py) {
    const token = ++tooltipToken;
    const rows = columns.filter((c) => c !== smilesCol).slice(0, 14).map((c) => {
      const v = valueOf(c, i);
      return `<tr><td>${escapeHtml(c.name)}</td><td>${escapeHtml(String(formatValue(v, c.integer)))}</td></tr>`;
    }).join("");
    const smiles = smilesCol ? smilesCol.values[i] : null;
    tooltip.innerHTML = (smiles ? `<div class="mol"></div><div class="smiles">${escapeHtml(smiles)}</div>` : "") + `<table>${rows}</table>`;
    tooltip.style.display = "block";
    placeTooltip(px, py);
    if (smiles) {
      const RDKit = await rdkit();
      if (token !== tooltipToken) return;
      const svg = RDKit ? structureSvg(RDKit, smiles) : "";
      const box = tooltip.querySelector(".mol");
      if (box) box.innerHTML = svg || `<div class="muted">${RDKit ? "Cannot draw structure" : "Structure drawing needs internet access (or save the map with offline=True)"}</div>`;
      placeTooltip(px, py);
    }
  }
  function placeTooltip(px, py) {
    const w = tooltip.offsetWidth, h = tooltip.offsetHeight, W = stage.clientWidth, H = stage.clientHeight;
    let x = px + 16, y = py + 16;
    if (x + w > W - 4) x = px - w - 16;
    if (y + h > H - 4) y = Math.max(4, H - h - 4);
    tooltip.style.left = `${Math.max(4, x)}px`; tooltip.style.top = `${y}px`;
  }
  const hideTooltip = () => { tooltipToken++; tooltip.style.display = "none"; };
  const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  function pick(px, py) {
    const [x, y] = toData(px, py);
    const radius = (Math.max(+$("point-size").value / 2, 3) + 3) / state.view.scale;
    return grid.nearest(x, y, radius, state.visible);
  }

  // ---- interaction
  const overlay = $("overlay"), octx = overlay.getContext("2d");
  let drag = null;
  stage.addEventListener("pointerdown", (e) => {
    if (e.target.closest("#toggle, #tooltip")) return;
    stage.setPointerCapture(e.pointerId);
    const r = stage.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    drag = { lasso: e.shiftKey, x: px, y: py, moved: false, points: [[px, py]], view: { ...state.view } };
    hideTooltip();
  });
  stage.addEventListener("pointermove", (e) => {
    const r = stage.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    if (drag) {
      if (Math.abs(px - drag.x) + Math.abs(py - drag.y) > 3) drag.moved = true;
      if (drag.lasso) { drag.points.push([px, py]); drawLasso(drag.points); }
      else if (drag.moved) {
        state.view.cx = drag.view.cx - (px - drag.x) / state.view.scale;
        state.view.cy = drag.view.cy + (py - drag.y) / state.view.scale;
        redraw();
      }
      return;
    }
    const i = pick(px, py);
    if (i !== state.hover) { state.hover = i; updateHighlight(); }
    if (i >= 0) showTooltip(i, px, py); else hideTooltip();
    stage.style.cursor = i >= 0 ? "pointer" : "default";
  });
  stage.addEventListener("pointerup", (e) => {
    if (!drag) return;
    const r = stage.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    if (drag.lasso && drag.moved) lassoSelect(drag.points, true);
    else if (!drag.moved) {
      const i = pick(px, py);
      if (i >= 0) setSelected([i], e.ctrlKey || e.metaKey ? "toggle" : "replace");
      else if (!(e.ctrlKey || e.metaKey)) setSelected([], "replace");
    }
    drag = null;
    octx.clearRect(0, 0, overlay.width, overlay.height);
  });
  stage.addEventListener("pointerleave", () => { if (!drag) { hideTooltip(); state.hover = -1; updateHighlight(); } });
  stage.addEventListener("wheel", (e) => {
    e.preventDefault();
    const r = stage.getBoundingClientRect(), px = e.clientX - r.left, py = e.clientY - r.top;
    const [x, y] = toData(px, py);
    const factor = Math.exp(-e.deltaY * (e.deltaMode === 1 ? 0.05 : 0.0015));
    state.view.scale = Math.min(baseScale * 1e5, Math.max(baseScale * 0.2, state.view.scale * factor));
    state.view.cx = x - (px - stage.clientWidth / 2) / state.view.scale;
    state.view.cy = y + (py - stage.clientHeight / 2) / state.view.scale;
    hideTooltip();
    redraw();
  }, { passive: false });

  function drawLasso(points) {
    const dpr = window.devicePixelRatio || 1;
    if (overlay.width !== overlay.clientWidth * dpr) { overlay.width = overlay.clientWidth * dpr; overlay.height = overlay.clientHeight * dpr; }
    octx.setTransform(dpr, 0, 0, dpr, 0, 0);
    octx.clearRect(0, 0, overlay.clientWidth, overlay.clientHeight);
    octx.beginPath();
    points.forEach(([x, y], k) => k ? octx.lineTo(x, y) : octx.moveTo(x, y));
    octx.closePath();
    octx.fillStyle = "rgba(120,120,140,0.12)"; octx.fill();
    octx.strokeStyle = theme.accent; octx.lineWidth = 1.5; octx.setLineDash([5, 4]); octx.stroke();
  }
  function lassoSelect(points, add) {
    const poly = points.map(([px, py]) => toData(px, py));
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const [x, y] of poly) { x0 = Math.min(x0, x); x1 = Math.max(x1, x); y0 = Math.min(y0, y); y1 = Math.max(y1, y); }
    const hits = [];
    for (let i = 0; i < n; i++) {
      const x = pos[2 * i], y = pos[2 * i + 1];
      if (!state.visible[i] || x < x0 || x > x1 || y < y0 || y > y1) continue;
      let inside = false;
      for (let a = 0, b = poly.length - 1; a < poly.length; b = a++) {
        const [xa, ya] = poly[a], [xb, yb] = poly[b];
        if ((ya > y) !== (yb > y) && x < (xb - xa) * (y - ya) / (yb - ya) + xa) inside = !inside;
      }
      if (inside) hits.push(i);
    }
    setSelected(hits, add ? "add" : "replace");
  }

  // ---- controls
  const colorBy = $("color-by");
  colorBy.append(new Option("None", ""));
  const colorable = columns.filter((c) => c.kind !== "text");
  for (const c of colorable) colorBy.append(new Option(c.name, c.name));
  colorBy.onchange = () => { state.colorBy = colorBy.value || null; applyColors(); };

  const searchCol = $("search-col");
  // Identifier-like columns first, SMILES last.
  const idLike = (c) => /(^|[^a-z])(id|name|title)([^a-z]|$)/i.test(c.name) ? 0 : c.kind === "text" ? 1 : 2;
  const searchable = columns.filter((c) => c.kind !== "num" && c !== smilesCol).sort((a, b) => idLike(a) - idLike(b));
  for (const c of searchable) searchCol.append(new Option(c.name, c.name));
  if (smilesCol) searchCol.append(new Option(smilesCol.name, smilesCol.name));
  if (!searchCol.options.length) { searchCol.disabled = true; $("search").disabled = true; $("search").placeholder = "No text column to search"; }
  $("search").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });

  const addFilterSel = $("add-filter");
  addFilterSel.append(new Option("Add a filter…", ""));
  for (const c of columns.filter((c) => c !== smilesCol)) addFilterSel.append(new Option(c.name, c.name));
  addFilterSel.onchange = () => {
    const name = addFilterSel.value;
    addFilterSel.value = "";
    if (!name || state.filters.has(name)) return;
    addFilter(name); renderFilters(); applyFilters();
    if (state.colorBy === name) applyColors();
  };

  for (const id of ["point-size", "edge-alpha", "show-edges"]) $(id).addEventListener("input", redraw);
  $("reset-view").onclick = resetView;
  $("sel-zoom").onclick = zoomToSelection;
  $("sel-clear").onclick = () => setSelected([], "replace");
  $("sel-export").onclick = () => { if (state.nSelected) exportCsv(); };
  $("toggle").onclick = () => { $("panel").classList.toggle("hidden"); setTimeout(redraw, 200); };
  window.addEventListener("resize", redraw);
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { readTheme(); applyColors(); });

  // Point size default depends on density.
  $("point-size").value = n > 200000 ? 1 : n > 20000 ? 2 : n > 2000 ? 3 : 5;
  $("edge-alpha").value = n > 200000 ? 0.25 : 0.5;

  // Default colouring: first categorical column with a few categories, else first numeric column.
  const firstCat = colorable.find((c) => c.kind === "cat" && c.categories.length <= MAX_COLORS);
  state.colorBy = (firstCat || colorable.find((c) => c.kind === "num") || {}).name ?? null;
  colorBy.value = state.colorBy ?? "";

  resetView();
  baseScale = state.view.scale;
  applyColors();
  applyFilters();
  $("loading").remove();
  window.chemviz = { state, data, setSelected, fitTo, applyColors };  // handle for scripting and tests
}

main().catch((e) => {
  console.error(e);
  const el = $("loading");
  if (el) el.textContent = "Could not display the map: " + e.message;
});
</script>
</body>
</html>
