[project]
name = "chemviz"
version = "0.1.0"
description = "Fast, easy-to-install chemical space visualization: TMAP, UMAP, t-SNE and PCA"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Pablo Mas", email = "pablovn.mas@gmail.com" }
]
requires-python = ">=3.12"
keywords = ["cheminformatics", "chemical space", "tmap", "umap", "tsne", "pca", "visualization", "minhash", "lsh", "rdkit", "webgl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numba>=0.59",
    "numpy>=1.26",
    "pandas>=2.1.1",
    "rdkit>=2023.9.1",
]

[project.scripts]
chemviz = "chemviz.cli:main"

[project.urls]
Homepage = "https://github.com/pablo-mas/chemviz"
Repository = "https://github.com/pablo-mas/chemviz"
Issues = "https://github.com/pablo-mas/chemviz/issues"
Changelog = "https://github.com/pablo-mas/chemviz/blob/main/CHANGELOG.md"

[project.optional-dependencies]
jupyter = [
    "anywidget>=0.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
dev = [
    "anywidget>=0.11.0",
    "pytest>=9.2.0",
    "scipy>=1.18.1",
]
